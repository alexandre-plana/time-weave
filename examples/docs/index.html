<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Documentation de Time Weave : installation, modèle de données, synchronisation, composants React, personnalisation et recettes." />
    <title>Documentation — Time Weave</title>
    <script>
      /* Demo theme before first paint: light unless chosen otherwise (see theme.ts). */
      try {
        var t = localStorage.getItem('tw-demo-theme');
        document.documentElement.dataset.theme = t === 'dark' || t === 'auto' ? t : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
